<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoToMyPC Connectivity Check</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --fg:#1b2733; --muted:#66788a; --ok:#1a7f37; --bad:#c62828; --warn:#b26a00; --line:#dde3ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12181f; --card:#1b242d; --fg:#e6edf3; --muted:#8fa1b3; --ok:#3fb950; --bad:#f85149; --warn:#d29922; --line:#2b3742; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  #banner { font-size:1.15rem; font-weight:600; }
  #banner.ok { color:var(--ok); } #banner.bad { color:var(--bad); } #banner.warn { color:var(--warn); }
  progress { width:100%; height:8px; margin-top:10px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; font-size:.92rem; }
  th { color:var(--muted); font-weight:600; }
  td.host { font-family:ui-monospace,Menlo,Consolas,monospace; word-break:break-all; }
  .s { font-weight:600; white-space:nowrap; }
  .s.ok { color:var(--ok); } .s.bad { color:var(--bad); } .s.run { color:var(--muted); }
  .note { color:var(--muted); font-size:.82rem; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; margin-right:8px; }
  button.primary { background:#0a6cff; border-color:#0a6cff; color:#fff; }
  .env { font-size:.85rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>GoToMyPC Connectivity Check</h1>
  <p class="sub">This page tests whether your network allows the connections GoToMyPC needs. It runs automatically &mdash; just wait for the result.</p>

  <div class="card">
    <div id="banner" class="run">Running checks&hellip;</div>
    <progress id="prog" value="0" max="1"></progress>
    <div id="detail" class="note" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Status</th><th>Endpoint</th><th>Purpose</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="card">
    <button class="primary" id="rerun">Run again</button>
    <button id="copy">Copy results</button>
    <div class="env" id="env" style="margin-top:12px"></div>
    <p class="note">If any required check fails, send the copied results to your IT/support contact.</p>
  </div>
</main>

<script>
/*
 * ENDPOINTS: edit this list to match the firewall KB article:
 * https://support.gotomypc.com/help/what-are-the-optimal-firewall-configurations
 * Browsers cannot test wildcard domains or non-web ports, so each wildcard
 * is represented by one or more concrete hostnames.
 *   required: false  => failure is reported as a warning, not a failure.
 *   scheme:   "https" (default, port 443) or "http" (port 80).
 */
const ENDPOINTS = [
  { host: "www.gotomypc.com",            purpose: "GoToMyPC website (*.gotomypc.com)", required: true },
  { host: "app.gotomypc.com",            purpose: "GoToMyPC web app / viewer (*.gotomypc.com)", required: true },
  { host: "static.gotomypc.com",         purpose: "Static assets (*.gotomypc.com)", required: false },
  { host: "www.goto.com",                purpose: "GoTo services (*.goto.com)", required: true },
  { host: "authentication.logmeininc.com", purpose: "Sign-in / authentication (*.logmeininc.com)", required: true },
  { host: "secure.logmein.com",          purpose: "Account services (*.logmein.com)", required: true },
  { host: "www.logmeininc.com",          purpose: "LogMeIn services (*.logmeininc.com)", required: false },
  { host: "api.getgo.com",               purpose: "GoTo API (*.getgo.com)", required: false },
  { host: "www.gotomypc.com", scheme: "http", purpose: "HTTP port 80 fallback", required: false },
];
const TIMEOUT_MS = 8000;

const $ = id => document.getElementById(id);
let results = [];

async function probe(ep) {
  const scheme = ep.scheme || "https";
  const url = `${scheme}://${ep.host}/?_=${Date.now()}${Math.random().toString(36).slice(2)}`;
  const t0 = performance.now();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try {
    // no-cors: any HTTP response (even 403/404) resolves as opaque => host reachable.
    // DNS failure, TLS failure, connection block or proxy denial => rejects.
    await fetch(url, { mode: "no-cors", cache: "no-store", credentials: "omit", signal: ctl.signal });
    return { ok: true, ms: Math.round(performance.now() - t0) };
  } catch (e) {
    return { ok: false, ms: Math.round(performance.now() - t0), err: e.name === "AbortError" ? "timed out" : "blocked or unreachable" };
  } finally { clearTimeout(timer); }
}

function render() {
  $("rows").innerHTML = "";
  ENDPOINTS.forEach((ep, i) => {
    const r = results[i];
    const tr = document.createElement("tr");
    let st, cls;
    if (!r) { st = "Testing…"; cls = "run"; }
    else if (r.ok) { st = `✔ OK (${r.ms} ms)`; cls = "ok"; }
    else { st = (ep.required === false ? "⚠ " : "✘ ") + r.err; cls = "bad"; }
    const label = `${ep.scheme || "https"}://${ep.host}` + (ep.required === false ? " (optional)" : "");
    tr.innerHTML = `<td class="s ${cls}"></td><td class="host"></td><td></td>`;
    tr.children[0].textContent = st;
    tr.children[1].textContent = label;
    tr.children[2].textContent = ep.purpose;
    $("rows").appendChild(tr);
  });
}

function summarize(done) {
  const b = $("banner");
  const finished = results.filter(Boolean).length;
  $("prog").value = finished / ENDPOINTS.length;
  if (!done) return;
  const reqFail = ENDPOINTS.filter((ep, i) => ep.required !== false && !results[i].ok);
  const optFail = ENDPOINTS.filter((ep, i) => ep.required === false && !results[i].ok);
  if (!reqFail.length && !optFail.length) {
    b.className = "ok"; b.textContent = "✔ All checks passed. Your network can reach GoToMyPC.";
    $("detail").textContent = "";
  } else if (!reqFail.length) {
    b.className = "warn"; b.textContent = "⚠ Passed, with warnings on optional endpoints.";
    $("detail").textContent = "Optional: " + optFail.map(e => e.host).join(", ");
  } else {
    b.className = "bad"; b.textContent = `✘ ${reqFail.length} required endpoint(s) could not be reached. GoToMyPC may not work on this network.`;
    $("detail").textContent = "Blocked: " + reqFail.map(e => e.host).join(", ");
  }
}

function report() {
  const lines = [`GoToMyPC connectivity check - ${new Date().toISOString()}`, $("banner").textContent, ""];
  ENDPOINTS.forEach((ep, i) => {
    const r = results[i];
    lines.push(`${r && r.ok ? "PASS" : "FAIL"}  ${ep.scheme || "https"}://${ep.host}${ep.required === false ? " (optional)" : ""}  ${r ? (r.ok ? r.ms + " ms" : r.err) : "not run"}`);
  });
  lines.push("", `Browser: ${navigator.userAgent}`, `Online flag: ${navigator.onLine}`);
  return lines.join("\n");
}

async function run() {
  results = new Array(ENDPOINTS.length);
  $("banner").className = "run"; $("banner").textContent = "Running checks…"; $("detail").textContent = "";
  $("rerun").disabled = true; render(); summarize(false);
  await Promise.all(ENDPOINTS.map(async (ep, i) => {
    results[i] = await probe(ep); render(); summarize(false);
  }));
  summarize(true); $("rerun").disabled = false;
}

$("rerun").onclick = run;
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(report()); $("copy").textContent = "Copied!"; }
  catch { window.prompt("Copy these results:", report()); }
  setTimeout(() => $("copy").textContent = "Copy results", 2000);
};
$("env").textContent = `Browser: ${navigator.userAgent}`;
run();
</script>
</body>
</html>
